name: fenrir

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # This job checks if an identical workflow is being triggered by different
  # event and skips it. For instance there is no need to run the same pipeline
  # twice for pull_request and push for identical commit sha.
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@1cce3390c2bfda521930d01229c073c7ff920824
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@04a1aebece824b56e6ad6a401d015479cd1c50b3
        with:
          skip_after_successful_duplicate: 'true'
          concurrent_skipping: same_content
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            build:
              - "hosts/fenrir/**"
              - ".github/workflows/fenrir.yml"
              - "modules/**"
              - "pkgs/**"
              - "flake.nix"
              - "flake.lock"
  nix-build:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' && needs.pre_job.outputs.build == 'true' }}
    runs-on: nixos

    steps:
    - uses: actions/checkout@1cce3390c2bfda521930d01229c073c7ff920824
    - name: Build fenrir
      run: nix build .#nixosConfigurations.fenrir.config.system.build.toplevel -L --accept-flake-config